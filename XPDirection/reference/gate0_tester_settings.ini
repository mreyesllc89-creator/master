; Gate 0 - "nothing of the EA got modified".
;
; Run the Strategy Tester TWICE with this file, changing only Expert=:
;   run A (baseline) : Expert=Experts\FlashGold_Continuation_v2.mq5      (1.03,
;                      sha256 75820278a87ee5b65d9e6c4518a1ab0936d229fed6025893c188bca2f3d87498)
;   run B (candidate): Expert=Experts\FlashGold_Continuation_v2_XPDIR.mq5 (1.05-XPDIR)
; Save each result as an HTML report, then:
;   python3 compare_trades.py baseline_1.03.html candidate_1.05.html
; Pass = "G0 identical": same deals, in the same order, at the same times and
; prices. InpDirMode stays DIR_OFF in run B - it is the default, so the ladder
; creates no indicator handle and reads nothing.
;
; Every other input is left at its build default in BOTH runs. Do not set the
; XPDir inputs in run B: DIR_OFF is what is being proved.
;
; Place this file in MQL5\Profiles\Tester\ and load it with the tester's
; "Load" button, or pass it on the command line:
;   terminal64.exe /config:...\gate0_tester_settings.ini

[Tester]
Expert=Experts\FlashGold_Continuation_v2.mq5
Symbol=XAUUSD-ECNc
Period=M1
Model=4
; Model=4 -> "Every tick based on real ticks". The EA reads the tick tape
; (CopyTicks) for the burst bundle, the friction filter and the CP snapshot;
; any other model makes the two runs incomparable, not just inaccurate.
Optimization=0
FromDate=2026.09.15
ToDate=2026.09.19
; A 5-day window on the host's own real-tick history. Pick a window that
; actually produced trades in run A - compare_trades.py fails the gate if the
; baseline has no deals, because an empty trade list proves nothing.
ForwardMode=0
Deposit=10000
Currency=USD
Leverage=1:100
ExecutionMode=0
Visual=0
ProfitInPips=0
