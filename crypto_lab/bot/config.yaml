# Champion configuration. The Engineer role rewrites this file; the code never changes for a new champion.
# Testnet keys live on the server (OWNER_NOTES.md); orders go to the Binance futures TESTNET only.
# No champion yet: the placeholder below exercises the order path (fills, stops, Sentinel), it is not an edge.
testnet: true
dry_run: false
symbol: BTCUSDT
tf: 1h
strategy: donchian_trend        # placeholder benchmark until the Judge crowns a champion
params: {n: 96, atr_mult: 3.0}
paper_equity: 10000
risk_pct: 0.5
max_leverage: 5
entry_timeout_s: 240
history_bars: 3000
log: decisions.jsonl
sentinel:
  daily_halt_pct: 3.0
  max_consecutive_losses: 3
  stale_s: 30
  max_fill_dev_pct: 0.5
